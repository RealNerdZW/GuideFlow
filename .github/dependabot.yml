version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per ecosystem rather than a dozen — this is a small project and
      # these move together anyway.
      dev-tooling:
        patterns:
          - "@typescript-eslint/*"
          - "eslint*"
          - "prettier"
          - "typescript"
          - "tsup"
          - "turbo"
          - "vitest"
          - "size-limit"
          - "@size-limit/*"
      playwright:
        patterns:
          - "@playwright/*"
          - "@axe-core/*"
      storybook:
        patterns:
          - "@storybook/*"
          - "storybook"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
