name: Deploy Docs

on:
  push:
    branches: [master]
    paths:
      - 'apps/docs/**'
      - 'packages/*/src/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build every publishable package, not a hardcoded list. This step used to
      # name four — core, react, ai, analytics — and went stale the moment the
      # demo started mounting @guideflow/banner, checklist and survey (7.8b,
      # 7.8c). Their .d.ts never got emitted, so "Build demo" died with a wall of
      # TS2307 "Cannot find module" and the docs site stopped deploying. It fails
      # HERE, at deploy, on master, after review — the same late-failure shape
      # that the `docs` job in ci.yml exists to prevent.
      #
      # An exclude list cannot rot when a package is added; an include list can.
      - name: Build packages
        run: pnpm turbo run build --filter=!@guideflow/storybook --filter=!docs --filter=!e2e --filter=!@guideflow/demo

      - name: Build docs
        run: pnpm docs:build

      - name: Build demo
        run: pnpm --filter @guideflow/demo build

      - name: Copy demo into docs output
        run: cp -r apps/demo/dist apps/docs/.vitepress/dist/demo

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/docs/.vitepress/dist
          keep_files: false
