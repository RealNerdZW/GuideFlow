name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Turbo prints a summary but its cache is per-job; keep output readable.
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # ── Unit gate ──────────────────────────────────────────────────────────────
  # Matrix across the full supported range. `engines` claims >=18 and nothing
  # tested that until now, so 18 and 20 were unverified in every release.
  unit:
    name: Build, type-check, lint & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo run build --filter=!@guideflow/storybook --filter=!docs --filter=!e2e --filter=!@guideflow/demo

      - name: Type check
        run: pnpm turbo run type-check --filter=!@guideflow/storybook --filter=!docs --filter=!@guideflow/demo

      - name: Lint
        run: pnpm turbo run lint --filter=!@guideflow/storybook --filter=!docs --filter=!e2e --filter=!@guideflow/demo

      - name: Test
        run: pnpm turbo run test --filter=!@guideflow/storybook --filter=!docs --filter=!e2e --filter=!@guideflow/demo

  # ── Docs gate ──────────────────────────────────────────────────────────────
  # Every task above passes `--filter=!docs`, and `docs.yml` only fires on push
  # to master — so until this job existed the docs site was built for the FIRST
  # time after merge, at deploy. Two breaks reached master that way and were
  # found by hand during the 0.2.0 release:
  #
  #   1. A dead link (`./security`, a page that does not exist). VitePress fails
  #      the build on it, at `renderStart` — which ABORTS BEFORE SSR and so
  #      masked the second one entirely.
  #   2. `{{user.name}}` in a markdown table. Vue compiles `{{ }}` in markdown
  #      as a real expression, so it evaluated `user.name` against an undefined
  #      `user` and died with "Cannot read properties of undefined".
  #
  # The scan below catches what a build CANNOT: a token like `{{plan}}` that
  # does not crash and instead renders as an empty string. Five of those were
  # live on the two pages documenting token syntax, including the security
  # example, where `<a href="/r?next={{to}}">` rendered as `href="/r?next="` —
  # erasing the exact thing the passage warns about.
  docs:
    name: Docs site builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The docs import the packages, so they must exist first.
      - run: pnpm turbo run build --filter='@guideflow/core' --filter='@guideflow/react' --filter='@guideflow/ai' --filter='@guideflow/analytics'

      - name: Guard against unescaped Vue interpolation
        run: node scripts/check-docs-interpolation.mjs

      - name: Build docs
        run: pnpm docs:build

  # ── Coverage gate ──────────────────────────────────────────────────────────
  # Per-package thresholds are ratchets set just below what each suite achieves
  # today (see each vitest.config.ts), so a regression fails rather than
  # quietly eroding. Raise them as coverage improves; never lower them to make
  # a build pass.
  coverage:
    name: Coverage thresholds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=!@guideflow/storybook --filter=!docs --filter=!e2e --filter=!@guideflow/demo

      - name: Run tests with coverage
        run: |
          for pkg in core react vue svelte ai analytics cli checklist devtools; do
            if [ -f "packages/$pkg/vitest.config.ts" ]; then
              echo "::group::coverage $pkg"
              pnpm exec vitest run --root "packages/$pkg" --coverage --coverage.reporter=text-summary --coverage.reporter=lcov
              echo "::endgroup::"
            fi
          done

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: packages/*/coverage/lcov.info
          retention-days: 7
          if-no-files-found: ignore

  # ── Bundle-size gate ───────────────────────────────────────────────────────
  # @guideflow/core's size is a published promise. It was measured locally and
  # never enforced anywhere, so a regression could ship silently.
  size:
    name: Bundle size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @guideflow/core build
      - name: Check size budget
        run: pnpm --filter @guideflow/core size

  # ── Packaging gate ─────────────────────────────────────────────────────────
  # Verifies that what npm would actually publish matches the exports map.
  # Catches the class of bug where dist/styles is missing from the tarball.
  pack:
    name: Package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=!@guideflow/storybook --filter=!docs --filter=!e2e --filter=!@guideflow/demo
      - name: Verify publishable package contents
        run: node scripts/verify-pack.mjs

  # ── End-to-end gate ────────────────────────────────────────────────────────
  # The Playwright suite had never executed: it booted Storybook while the specs
  # targeted a fixture page, the fixture defined an invalid flow, and the a11y
  # spec imported an export that does not exist. All three are fixed; this job
  # keeps it that way.
  e2e:
    name: E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `project` and `browser` are separate on purpose: the extension project
        # runs in Chromium but is not named `chromium`, and
        # `playwright install extension` is not a thing. Keying the cache on
        # `browser` also lets the two Chromium jobs share one download.
        include:
          - { project: chromium, browser: chromium }
          - { project: firefox, browser: firefox }
          - { project: webkit, browser: webkit }
          - { project: extension, browser: chromium }

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(pnpm --filter e2e exec playwright --version | sed 's/^Version //')" >> "$GITHUB_OUTPUT"

      # Restore and save are split deliberately. The combined `actions/cache`
      # only writes its cache in a post step when the job SUCCEEDS, and these
      # jobs failed on every run since they were added — so nothing was ever
      # stored and every run reported "Cache not found". A separate save step,
      # placed before the steps that can fail, breaks that loop.
      - name: Restore Playwright browsers
        uses: actions/cache/restore@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the Playwright version, not on pnpm-lock.yaml. Browser
          # builds only change when Playwright does, but the lockfile hash
          # rotates on any dependency change anywhere in the monorepo — 12 of
          # the last dozen lockfile-touching commits would each have thrown the
          # browser cache away.
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.browser }}

      - name: Install Playwright browser
        # `chromium` here installs BOTH the headless shell and the full
        # Chromium build. The extension project needs the full one —
        # `channel: 'chromium'` — because the headless shell cannot load an
        # extension at all, and fails by loading nothing rather than by erroring.
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Save Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.browser }}

      - name: Build core
        run: pnpm --filter @guideflow/core build

      - name: Run E2E
        # No `--` before the flag: pnpm 8 forwards the separator itself, so
        # `test:e2e -- --project=x` reached Playwright as `test "--" "--project=x"`,
        # where `--` was read as a test-file regex — "No tests found", every run.
        run: pnpm --filter e2e test:e2e --project=${{ matrix.project }}

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: apps/e2e/playwright-report/
          retention-days: 7

  # ── The extension, as a downloadable artifact ──────────────────────────────
  # Until this existed the only way to obtain the extension was to clone the
  # repo and build it, which is not a path a non-engineer completes.
  extension-zip:
    name: Package extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `turbo run`, not `pnpm --filter`. The extension imports
      # `@guideflow/core/selector` (7.9a: there is exactly one selector builder),
      # so building it in isolation leaves those imports unresolvable — and Vite
      # does not error on that. It silently drops the three HTML entries and
      # emits only the plain-TS ones, which is why the failure surfaces as
      # "Expected Vite to emit src/panel/index.html" from the copy-static plugin
      # rather than as a resolve error. Measured: 46 modules transformed with
      # core's dist present, 8 without.
      #
      # This job never ran green — it was added alongside the extension in 7.9b
      # and its first Linux run was the 0.2.0 release PR. It passed locally
      # throughout because a developer's `packages/core/dist` already exists.
      # `E2E (extension)` did NOT catch it: that job builds core first, and its
      # `webServer.command` builds core and devtools together.
      #
      # devtools declares `@guideflow/core: workspace:*`, so `^build` orders
      # this correctly instead of hardcoding the dependency here.
      - run: pnpm turbo run build --filter=@guideflow/devtools
      - run: pnpm --filter @guideflow/devtools package

      - uses: actions/upload-artifact@v4
        with:
          name: guideflow-devtools-extension
          path: guideflow-devtools-*.zip
          retention-days: 30

  # ── Dependency audit ───────────────────────────────────────────────────────
  # Split deliberately. The blocking check covers only what a consumer actually
  # installs; dev tooling is reported but does not fail the build, because a
  # gate that is red on day one is a gate people learn to ignore.
  #
  # Production was 8 advisories (3 high) until @guideflow/cli stopped shipping
  # vite as a hard dependency — every one of them came from that single import.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Blocking: anything high or critical that reaches a consumer.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      # Reporting: dev tooling. Surfaced in the job summary, never blocking.
      - name: Audit dev dependencies (advisory)
        if: always()
        continue-on-error: true
        run: |
          echo '### Dev-dependency advisories' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Not blocking — these do not ship to consumers. Track them down over time.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          pnpm audit 2>&1 | tail -20 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # GitHub's own dependency review on PRs — flags a newly introduced
  # vulnerable dependency at the point it is added, which an audit of the whole
  # tree cannot distinguish from pre-existing debt.
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  # ── Changeset gate ─────────────────────────────────────────────────────────
  # A change to a published package without a changeset ships silently — no
  # version bump, no CHANGELOG entry. Advisory on PRs from forks.
  changeset:
    name: Changeset present
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check for a changeset
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'packages/*/src/**' 'packages/*/package.json' || true)
          if [ -z "$CHANGED" ]; then
            echo "No published-package source changed — changeset not required."
            exit 0
          fi
          if git diff --name-only origin/${{ github.base_ref }}...HEAD -- '.changeset/*.md' | grep -qv 'README'; then
            echo "Changeset found."
            exit 0
          fi
          echo "::error::This PR changes a published package but adds no changeset. Run 'pnpm changeset'."
          exit 1
