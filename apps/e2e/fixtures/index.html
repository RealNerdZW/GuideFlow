<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GuideFlow E2E Fixture</title>

  <!--
    Loads the REAL built artefacts from packages/core/dist, served from the repo
    root by serve.mjs. No bundler is involved, so these tests exercise the
    package a consumer actually installs — including the IIFE global build and
    the ./styles subpath export, neither of which any other test covers.
  -->
  <link rel="stylesheet" href="/packages/core/dist/styles/index.css" />

  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 40px; }
    h1 { margin-top: 0; font-size: 20px; }
    .box {
      padding: 24px; border: 2px solid #e5e7eb; border-radius: 8px;
      margin: 16px 0; width: 200px;
    }
    button {
      padding: 8px 16px; background: #6366f1; color: #fff; border: none;
      border-radius: 6px; cursor: pointer; font-size: 13px; margin-right: 4px;
    }
    /* Pushes #far-target well below the fold so scroll repositioning is testable. */
    .spacer { height: 1600px; }
  </style>
</head>
<body>
  <h1 id="heading">GuideFlow Test Page</h1>

  <button id="start-btn" type="button">Start Tour</button>
  <button id="start-final-btn" type="button">Start Two-Step Final Tour</button>
  <button id="start-scroll-btn" type="button">Start Scroll Tour</button>
  <button id="start-persisted-btn" type="button">Start Persisted Tour</button>
  <button id="start-multistate-btn" type="button">Start Multi-State Tour</button>
  <button id="start-clickthrough-btn" type="button">Start Click-Through Tour</button>
  <button id="start-blocking-btn" type="button">Start Blocking Tour</button>
  <button id="start-routed-btn" type="button">Start Routed Tour</button>
  <button id="start-missing-target-btn" type="button">Start Missing-Target Tour</button>

  <p>
    <label for="text-input">Type here</label>
    <input id="text-input" type="text" value="" />
  </p>

  <!-- Counts its own clicks, so a spec can prove a click actually landed on
       the target rather than being swallowed by the overlay. -->
  <button id="clickable-target" type="button">Click me</button>
  <span id="click-count">0</span>

  <!-- A two-"route" SPA, switched with pushState. #route-settings-target does
       not exist until the route changes, which is the whole point. -->
  <nav>
    <button id="go-settings" type="button">Go to settings</button>
    <button id="go-home" type="button">Go home</button>
  </nav>
  <div id="route-view"><div id="route-home-target" class="box">Home widget</div></div>

  <div id="step-one" class="box">Feature A</div>
  <div id="step-two" class="box">Feature B</div>
  <div id="step-three" class="box">Feature C</div>

  <div class="spacer"></div>
  <div id="far-target" class="box">Far Feature (below the fold)</div>
  <div class="spacer"></div>

  <!--
    Loads core's ESM build directly — it has zero dependencies, so there are no
    bare specifiers for the browser to resolve and no bundler is needed. Flows
    come from flows.js, which the core unit suite imports too, so the fixture
    and the engine contract cannot drift apart.
  -->
  <script type="module">
    import { createGuideFlow } from '/packages/core/dist/index.js'
    import { createNavigation } from '/packages/core/dist/navigation/index.js'
    import { flows } from './flows.js'

    // A pushState router, ~10 lines, standing in for React Router et al.
    function render (view) {
      document.getElementById('route-view').innerHTML = view === 'settings'
        ? '<div id="route-settings-target" class="box">Settings widget</div>'
        : '<div id="route-home-target" class="box">Home widget</div>'
    }
    function go (view) {
      const url = view === 'settings'
        ? '/apps/e2e/fixtures/index.html?view=settings'
        : '/apps/e2e/fixtures/index.html'
      history.pushState({}, '', url)
      render(view)
    }
    window.__gfGo = go
    window.addEventListener('popstate', function () {
      render(new URLSearchParams(location.search).get('view') || 'home')
    })

    const gf = createGuideFlow({
      context: { userId: 'e2e-user' },
      // No `subscribe` and no `navigate`: exercise the built-in history watcher
      // and the passive wait, which is the harder path of the two.
      navigation: createNavigation({ waitForRoute: 8000, waitForTarget: 3000, indicatorDelay: 50 }),
    })

    // The devtools extension detects tours through this global, and the library
    // never sets it — every integration must do this itself.
    window.__guideflow = gf

    // Test hooks: record the exact sequence of steps rendered, so specs can
    // assert on what happened rather than only on what is currently visible.
    window.__gfEnters = []
    window.__gfEvents = []
    gf.on('step:enter', function (e) { window.__gfEnters.push(e.stepId) })
    ;['tour:start', 'tour:complete', 'tour:abandon', 'tour:dismiss', 'step:skip'].forEach(function (name) {
      gf.on(name, function () { window.__gfEvents.push(name) })
    })

    window.__gfFlows = flows

    function wire (id, flow) {
      document.getElementById(id).addEventListener('click', function () {
        window.__gfEnters = []
        window.__gfEvents = []
        gf.start(flow)
      })
    }

    wire('start-btn', flows.basic)
    wire('start-final-btn', flows.final)
    wire('start-scroll-btn', flows.scroll)
    wire('start-persisted-btn', flows.persisted)
    wire('start-multistate-btn', flows.multistate)
    wire('start-clickthrough-btn', flows.clickThrough)
    wire('start-blocking-btn', flows.blocking)
    wire('start-routed-btn', flows.routed)
    wire('start-missing-target-btn', flows.missingTarget)

    document.getElementById('go-settings').addEventListener('click', function () { go('settings') })
    document.getElementById('go-home').addEventListener('click', function () { go('home') })

    window.__gfWaiting = []
    window.__gfTimeouts = []
    gf.on('step:waiting', function (e) { window.__gfWaiting.push(e.stepId + ':' + e.reason) })
    gf.on('step:timeout', function (e) { window.__gfTimeouts.push(e.stepId + ':' + e.reason) })

    // Proof that a click reached the page rather than the overlay.
    var clicks = 0
    document.getElementById('clickable-target').addEventListener('click', function () {
      clicks++
      document.getElementById('click-count').textContent = String(clicks)
    })

    // Signals to the specs that wiring is complete.
    window.__gfReady = true
  </script>
</body>
</html>
